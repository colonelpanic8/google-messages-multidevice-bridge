# The window spends its life on the bundled client, which Tauri classifies as
# local content. Nothing loaded over the network is granted these commands.

[[permission]]
identifier = "allow-app-commands"
description = "Lets the bundled client call this app's own commands."
commands.allow = [
  "get_bridge_url",
  "save_bridge_url",
  "open_external",
  "get_token",
  "save_token",
  "clear_token",
  "set_unread",
  "notify",
]
