<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Messages</title>
    <style>
      :root {
        color-scheme: light dark;
        --surface: #fff;
        --surface-low: #f0f4f9;
        --on-surface: #1f1f1f;
        --on-surface-variant: #444746;
        --outline: #c4c7c5;
        --primary: #0b57d0;
        --on-primary: #fff;
        --error: #b3261e;
        font-family:
          "Google Sans",
          Roboto,
          "Helvetica Neue",
          system-ui,
          sans-serif;
        font-size: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #131314;
          --surface-low: #1b1b1c;
          --on-surface: #e3e3e3;
          --on-surface-variant: #c4c7c5;
          --outline: #8e918f;
          --primary: #a8c7fa;
          --on-primary: #062e6f;
          --error: #f2b8b5;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--surface-low);
        color: var(--on-surface);
        padding: 24px;
      }
      .card {
        width: min(440px, 100%);
        background: var(--surface);
        border-radius: 28px;
        padding: 40px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 22px;
        font-weight: 500;
      }
      .brand img {
        width: 36px;
        height: 36px;
      }
      h1 {
        font-size: 24px;
        font-weight: 400;
        margin: 28px 0 8px;
      }
      p {
        color: var(--on-surface-variant);
        line-height: 1.5;
        margin: 0 0 8px;
      }
      form {
        display: grid;
        gap: 12px;
        margin: 24px 0 12px;
      }
      input {
        width: 100%;
        height: 52px;
        padding: 0 16px;
        border-radius: 8px;
        border: 1px solid var(--outline);
        background: var(--surface);
        color: inherit;
        font: inherit;
      }
      input:focus {
        outline: 1px solid var(--primary);
        border-color: var(--primary);
      }
      button {
        justify-self: end;
        height: 40px;
        padding: 0 20px;
        border: 0;
        border-radius: 20px;
        background: var(--primary);
        color: var(--on-primary);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      .error {
        color: var(--error);
        min-height: 1.5em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <img src="icon.png" alt="" />
        <span>Messages</span>
      </div>
      <h1>Connect to your bridge</h1>
      <p>
        Enter the address of your Google Messages Multi-Device Bridge. You will
        unlock it with the bridge token on the next screen.
      </p>
      <form id="form">
        <label class="sr-only" for="url"></label>
        <input
          id="url"
          type="url"
          required
          placeholder="https://bridge.example.ts.net"
          autocomplete="off"
        />
        <p id="error" class="error" role="alert"></p>
        <button type="submit">Continue</button>
      </form>
    </div>
    <script>
      const invoke = window.__TAURI__.core.invoke;
      const url = document.getElementById("url");
      const error = document.getElementById("error");
      invoke("get_bridge_url").then((saved) => {
        if (saved) url.value = saved;
      });
      document.getElementById("form").onsubmit = async (event) => {
        event.preventDefault();
        error.textContent = "";
        try {
          await invoke("save_bridge_url", { url: url.value.trim() });
        } catch (message) {
          error.textContent = String(message);
        }
      };
    </script>
  </body>
</html>
